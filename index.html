<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瑜樂傑｜積木生活選物店</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans TC",sans-serif;color:#252525;background:#fff}
a{text-decoration:none;color:inherit}
.top{background:#111;color:#fff;text-align:center;padding:9px;font-size:14px}
nav{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 6%;border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:5}
.logo{font-size:24px;font-weight:900}.logo span{color:#ff6b35}
.menu{display:flex;gap:28px;font-size:15px}.cart{font-weight:700}
section{padding:55px 7%}
.title{text-align:center;margin-bottom:35px}
.title h2{font-size:34px;margin:0 0 8px}.title p{color:#777}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.product{border:1px solid #eee;border-radius:18px;overflow:hidden;background:#fff;transition:.2s}
.product:hover{transform:translateY(-3px);box-shadow:0 8px 25px #00000012}
.product img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.info{padding:16px}.name{font-size:18px;font-weight:800;margin-bottom:8px}
.price{font-size:22px;font-weight:900;color:#ef5b4f}
.meta{color:#777;font-size:13px;margin-top:8px;line-height:1.6}
footer{background:#f7f7f7;padding:45px 7%;display:flex;justify-content:space-between;gap:30px}
.muted{color:#777;line-height:1.8}
@media(max-width:900px){.menu{display:none}.products{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){section{padding:45px 5%}.products{gap:12px}.info{padding:12px}.name{font-size:16px}}
</style>
</head>
<body>
<div class="top">🎉 瑜樂傑積木選物店</div>
<nav>
  <div class="logo">瑜樂傑<span>．</span>積木選物</div>
  <div class="menu"><a href="#products">商品列表</a><a href="#about">關於我們</a></div>
  <div class="cart">🛒 購物車</div>
</nav>

<section id="products">
  <div class="title">
    <h2>商品列表</h2>
    <p>精選積木與趣味小物</p>
  </div>
  <div class="products">
    <article class="product">
      <a href="https://s.shopee.tw/60Raw9ZY3B" target="_blank" rel="noopener">
      <img src="cartoon-bricks.avif" alt="卡通積木">
      <div class="info">
        <div class="name">卡通積木</div>
        <div class="price">NT$10／盒</div>
        <div class="meta">共72款｜隨機出貨<br>90盒／箱</div>
      </div>
      </a>
    </article>
    <article class="product">
      <a href="https://s.shopee.tw/60Raw9ZY3B" target="_blank" rel="noopener">
        <div style="aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffd6df,#fff1f5);font-size:90px">🐷</div>
        <div class="info">
          <div class="name">掛件花花豬</div>
          <div class="price">蝦皮商品頁</div>
          <div class="meta">點擊查看商品詳情與價格</div>
        </div>
      </a>
    </article>
  </div>
</section>

<section id="about">
  <div class="title"><h2>關於瑜樂傑</h2><p>積木・生活選物・趣味小物</p></div>
</section>

<footer>
  <div><strong>瑜樂傑企業社</strong><div class="muted">積木・生活選物・趣味小物</div></div>
  <div class="muted">客服｜購物須知｜退換貨政策<br>© 2026 Yulejie Enterprise</div>
</footer>
</body>
</html>
